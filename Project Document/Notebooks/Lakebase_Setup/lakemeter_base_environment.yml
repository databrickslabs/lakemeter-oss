# ============================================================================
# Lakemeter Base Environment for Databricks Serverless Notebooks
# ============================================================================
# This YAML file defines the Python dependencies for Lakemeter test notebooks
# and other serverless notebooks that connect to Lakebase (PostgreSQL).
#
# Usage:
#   1. Upload this file to Workspace: /Workspace/Users/<user>/lakemeter/Lakebase_Setup/
#   2. In any serverless notebook:
#      - Click the Environment side panel (⚙️)
#      - Under "Base environment", select "Custom"
#      - Browse to this YAML file
#      - Click "Apply"
#
# Dependencies will be automatically installed in the notebook environment.
# No need to run %pip install commands!
# ============================================================================

name: lakemeter_base_env
channels:
  - defaults

dependencies:
  - pip:
      # PostgreSQL adapter for Python
      # Required for connecting to Lakebase (PostgreSQL database)
      - psycopg2-binary==2.9.9
      
      # Data manipulation and analysis
      # Required for handling query results and data transformations
      - pandas==2.1.4
      
      # Pretty-print tabular data
      # Required for formatted console output in test notebooks
      - tabulate==0.9.0

# ============================================================================
# Version Notes:
# ============================================================================
# - psycopg2-binary: Binary version (no compilation needed)
#   Compatible with Databricks serverless compute
#
# - pandas: Pinned to 2.1.4 for stability
#   Compatible with Databricks Runtime
#
# - tabulate: Lightweight library for table formatting
#   No dependencies, always stable
#
# ============================================================================
# Maintenance:
# ============================================================================
# To update versions:
#   1. Test new versions in a notebook first
#   2. Update version numbers in this file
#   3. Increment the environment version number below
#   4. Re-upload to Workspace/Unity Catalog
# ============================================================================

version: "1.0.0"
description: "Lakemeter base environment for PostgreSQL connectivity and data analysis"

