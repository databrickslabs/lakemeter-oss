name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and resolve tested artifact
        id: metadata
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          ARTIFACT_NAME="lakemeter-release-candidate-${VERSION}-${CANDIDATE_SHA}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Download exact tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
          CANDIDATE_SHA: ${{ steps.metadata.outputs.candidate_sha }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty'
            )"
            if [ -n "${RUN_ID}" ]; then
              RUN_NAME="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                  --jq '.name'
              )"
              RUN_SHA="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                  --jq '.head_sha'
              )"
              RUN_CONCLUSION="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                  --jq '.conclusion // empty'
              )"
              if [ "${RUN_NAME}" = "Release candidate" ] \
                && [ "${RUN_SHA}" = "${CANDIDATE_SHA}" ] \
                && [ "${RUN_CONCLUSION}" = "success" ]; then
                break
              fi
              RUN_ID=""
            fi
            echo "Waiting for tested candidate artifact (${attempt}/30)..."
            sleep 10
          done
          if [ -z "${RUN_ID}" ]; then
            echo "No successful release-candidate artifact exists for this tag."
            exit 1
          fi
          test "$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.name'
          )" = "Release candidate"
          test "$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.head_sha'
          )" = "${CANDIDATE_SHA}"
          test "$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.conclusion'
          )" = "success"
          mkdir -p dist
          gh run download "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir dist

      - name: Verify candidate provenance and checksums
        env:
          EXPECTED_SHA: ${{ steps.metadata.outputs.candidate_sha }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("dist/candidate.json").read_text())
          expected = {
              "candidate_sha": os.environ["EXPECTED_SHA"],
              "integration_status": "passed",
              "version": os.environ["EXPECTED_VERSION"],
          }
          mismatches = {
              key: {"expected": value, "actual": metadata.get(key)}
              for key, value in expected.items()
              if metadata.get(key) != value
          }
          if mismatches:
              raise SystemExit(
                  f"Candidate artifact does not match tag: {mismatches}"
              )
          PY
          (
            cd dist
            sha256sum -c SHA256SUMS
          )

      - name: Attest runtime artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/lakemeter-*.tar.gz"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lakemeter-*.tar.gz
            dist/release-*.json
            dist/SHA256SUMS

