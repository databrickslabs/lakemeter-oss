name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyyaml
          npm ci --prefix frontend

      - name: Verify tag and version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "${PREVIOUS_TAG}" ]; then
            python scripts/validate_release.py --initial
          else
            python scripts/validate_release.py \
              --previous-version "${PREVIOUS_TAG#v}" \
              --base-ref "${PREVIOUS_TAG}"
          fi

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Verify release payload
        run: |
          python scripts/prepare_release.py --check
          python -m pytest \
            tests/upgrade \
            tests/schema/test_line_item_schema_alignment.py \
            -q

      - name: Assemble runtime artifact
        run: |
          mkdir -p dist/runtime
          python -c "from pathlib import Path; from scripts.upgrader.payload import build_runtime_payload; build_runtime_payload(Path('.').resolve(), Path('dist/runtime'))"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          tar -czf "dist/lakemeter-runtime-${VERSION}.tar.gz" -C dist/runtime .
          mkdir -p dist/upgrade/scripts
          cp -R dist/runtime dist/upgrade/app_source
          cp -R scripts/upgrades dist/upgrade/scripts/upgrades
          cp VERSION dist/upgrade/VERSION
          tar -czf "dist/lakemeter-upgrade-${VERSION}.tar.gz" -C dist/upgrade .
          cp scripts/upgrades/release.json "dist/release-${VERSION}.json"
          cd dist
          sha256sum \
            "lakemeter-runtime-${VERSION}.tar.gz" \
            "lakemeter-upgrade-${VERSION}.tar.gz" \
            "release-${VERSION}.json" \
            > SHA256SUMS

      - name: Attest runtime artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/lakemeter-*.tar.gz"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lakemeter-*.tar.gz
            dist/release-*.json
            dist/SHA256SUMS

